[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Backend services for optimizer app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "uvicorn>=0.22",
    "fastapi>=0.100",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "python-multipart>=0.0.6",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "httpx>=0.24",
    "minio>=7.2",
    "aio-pika>=9.4",
    "ortools>=9.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "pre-commit",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
        "E",
        "F",
        "I",
]

ignore = [
        "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"